# ============================================================
#  PERHATIAN: file ini TIDAK lagi dipakai installer.
#
#  Konfigurasi nginx untuk VPS sekarang dibuat OTOMATIS oleh
#  deploy/install.sh (disesuaikan dengan domain & pilihan SSL
#  yang Anda isi saat instalasi) di lokasi:
#     /etc/nginx/sites-available/isp-app.conf
#
#  File ini dibiarkan hanya sebagai CONTOH tampilan konfigurasi
#  minimal (HTTP-only via IP) untuk pembelajaran/manual setup.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
